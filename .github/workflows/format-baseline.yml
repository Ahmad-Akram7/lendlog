name: Format baseline files

on:
  push:
    branches:
      - perf/android-release-shrinking

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/android-release-shrinking
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx prettier --write context/StorageContext.tsx lib/settlements.js tests/settlements.test.js
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add context/StorageContext.tsx lib/settlements.js tests/settlements.test.js
            git commit -m "style: format storage and settlement files"
            git push
          fi
