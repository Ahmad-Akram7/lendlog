name: Format navigation component

on:
  push:
    branches:
      - design/ledger-redesign

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/ledger-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write components/CustomTabBar.tsx
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add components/CustomTabBar.tsx
            git commit -m "style: apply Prettier to bottom navigation"
            git push origin HEAD:design/ledger-redesign
          fi
