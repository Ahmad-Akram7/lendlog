# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# IDE settings may override values in this file.

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true

android.useAndroidX=true
android.enablePngCrunchInReleaseBuilds=true

# Build native libraries only for physical Android device architectures.
# ABI splits below produce separate, smaller APKs for 32-bit and 64-bit ARM.
reactNativeArchitectures=armeabi-v7a,arm64-v8a

newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# Image format support.
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

EX_DEV_CLIENT_NETWORK_INSPECTOR=false
expo.useLegacyPackaging=false

# Deprecated in Expo SDK 54; retained for compatibility with generated projects.
expo.edgeToEdgeEnabled=true
